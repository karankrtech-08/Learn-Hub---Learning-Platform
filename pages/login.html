<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LearnHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/custom.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body class="font-poppins bg-gray-50">
    <!-- Navigation -->
    <nav class="fixed top-0 w-full bg-white/90 backdrop-blur-md z-50 shadow-lg">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <a href="../index.html" class="flex items-center space-x-2">
                        <div class="w-10 h-10 bg-gradient-to-r from-blue-600 to-purple-600 rounded-lg flex items-center justify-center">
                            <i class="fas fa-graduation-cap text-white text-xl"></i>
                        </div>
                        <span class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">LearnHub</span>
                    </a>
                </div>
                
                <div class="hidden md:flex items-center space-x-8">
                    <a href="../index.html" class="nav-link text-gray-700 hover:text-blue-600 font-medium">Home</a>
                    <a href="courses.html" class="nav-link text-gray-700 hover:text-blue-600 font-medium">Courses</a>
                    <a href="dashboard.html" class="nav-link text-gray-700 hover:text-blue-600 font-medium">Dashboard</a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <a href="register.html" class="px-6 py-2 text-blue-600 font-medium hover:bg-blue-50 rounded-lg transition-colors duration-300">Register</a>
                    <a href="login.html" class="px-6 py-2 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-medium rounded-lg hover:shadow-lg transition-all duration-300 hover:scale-105">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="min-h-screen flex items-center justify-center px-6 py-12 pt-24">
        <div class="w-full max-w-md">
            <!-- Login Card -->
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold mb-2">Welcome Back</h1>
                    <p class="text-gray-600">Sign in to continue your learning journey</p>
                </div>
                
                <form id="login-form" class="space-y-6">
                    <div class="form-group">
                        <input type="email" 
                               id="email" 
                               name="email"
                               required
                               placeholder=" "
                               class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors duration-300">
                        <label for="email">Email Address</label>
                    </div>
                    
                    <div class="form-group">
                        <input type="password" 
                               id="password" 
                               name="password"
                               required
                               placeholder=" "
                               class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors duration-300 pr-12">
                        <label for="password">Password</label>
                        <button type="button" id="show-password" class="absolute right-3 top-3 text-gray-500 hover:text-gray-700">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    
                    <!-- Password Strength (for reset) -->
                    <div id="password-strength-container" class="hidden">
                        <div class="flex justify-between text-sm mb-1">
                            <span>Password strength:</span>
                            <span id="password-strength-text"></span>
                        </div>
                        <div id="password-strength" class="h-2 bg-gray-200 rounded-full"></div>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <label class="flex items-center">
                            <input type="checkbox" 
                                   id="remember-me"
                                   class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
                            <span class="ml-2 text-gray-700">Remember me</span>
                        </label>
                        <button type="button" id="forgot-password" class="text-blue-600 hover:text-blue-800 font-medium">
                            Forgot password?
                        </button>
                    </div>
                    
                    <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-semibold rounded-lg hover:shadow-lg transition-all duration-300 hover:scale-105">
                        Sign In
                    </button>
                </form>
                
                <div class="mt-8 pt-8 border-t border-gray-200">
                    <p class="text-center text-gray-600 mb-4">Or continue with</p>
                    <div class="grid grid-cols-2 gap-3">
                        <button class="py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors duration-300 flex items-center justify-center">
                            <i class="fab fa-google text-red-500 mr-2"></i>
                            Google
                        </button>
                        <button class="py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors duration-300 flex items-center justify-center">
                            <i class="fab fa-github text-gray-800 mr-2"></i>
                            GitHub
                        </button>
                    </div>
                </div>
                
                <p class="text-center mt-8 text-gray-600">
                    Don't have an account? 
                    <a href="register.html" class="text-blue-600 hover:text-blue-800 font-medium">
                        Sign up here
                    </a>
                </p>
            </div>
            
            <!-- Demo Accounts -->
            <div class="mt-8 bg-blue-50 rounded-xl p-6">
                <h3 class="font-bold text-blue-800 mb-3">Demo Accounts</h3>
                <div class="space-y-2 text-sm">
                    <p><span class="font-medium">Email:</span> student@learnhub.com</p>
                    <p><span class="font-medium">Password:</span> password123</p>
                    <p class="text-gray-600 text-xs">Use this demo account to test the platform</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Back to Home Button -->
    <a href="../index.html" id="back-to-home" class="fixed bottom-6 left-6 w-12 h-12 bg-gray-800 text-white rounded-full shadow-xl hover:shadow-2xl transition-all duration-300 hover:scale-110 z-40 flex items-center justify-center">
        <i class="fas fa-home"></i>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/auth.js"></script>
    <script src="../script.js"></script>
    <script>
        // Initialize login page
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is already logged in
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                showToast('You are already logged in', 'info');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            }
            
            // Add demo account to localStorage if not exists
            const users = JSON.parse(localStorage.getItem('users')) || [];
            const demoUserExists = users.some(u => u.email === 'student@learnhub.com');
            
            if (!demoUserExists) {
                users.push({
                    id: Date.now(),
                    name: 'Demo Student',
                    email: 'student@learnhub.com',
                    password: 'password123',
                    role: 'student',
                    avatar: 'https://ui-avatars.com/api/?name=Demo+Student&background=3b82f6&color=fff',
                    createdAt: new Date().toISOString()
                });
                localStorage.setItem('users', JSON.stringify(users));
            }
        });
    </script>
</body>
</html>
