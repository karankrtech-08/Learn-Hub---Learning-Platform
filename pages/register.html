<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LearnHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/custom.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body class="font-poppins bg-gray-50">
    <!-- Navigation -->
    <nav class="fixed top-0 w-full bg-white/90 backdrop-blur-md z-50 shadow-lg">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <a href="../index.html" class="flex items-center space-x-2">
                        <div class="w-10 h-10 bg-gradient-to-r from-blue-600 to-purple-600 rounded-lg flex items-center justify-center">
                            <i class="fas fa-graduation-cap text-white text-xl"></i>
                        </div>
                        <span class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">LearnHub</span>
                    </a>
                </div>
                
                <div class="hidden md:flex items-center space-x-8">
                    <a href="../index.html" class="nav-link text-gray-700 hover:text-blue-600 font-medium">Home</a>
                    <a href="courses.html" class="nav-link text-gray-700 hover:text-blue-600 font-medium">Courses</a>
                    <a href="dashboard.html" class="nav-link text-gray-700 hover:text-blue-600 font-medium">Dashboard</a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <a href="register.html" class="px-6 py-2 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-medium rounded-lg hover:shadow-lg transition-all duration-300 hover:scale-105">Register</a>
                    <a href="login.html" class="px-6 py-2 text-blue-600 font-medium hover:bg-blue-50 rounded-lg transition-colors duration-300">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Register Section -->
    <section class="min-h-screen flex items-center justify-center px-6 py-12 pt-24">
        <div class="w-full max-w-md">
            <!-- Register Card -->
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold mb-2">Create Account</h1>
                    <p class="text-gray-600">Start your learning journey today</p>
                </div>
                
                <form id="register-form" class="space-y-6">
                    <div class="form-group">
                        <input type="text" 
                               id="name" 
                               name="name"
                               required
                               placeholder=" "
                               class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors duration-300">
                        <label for="name">Full Name</label>
                    </div>
                    
                    <div class="form-group">
                        <input type="email" 
                               id="email" 
                               name="email"
                               required
                               placeholder=" "
                               class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors duration-300">
                        <label for="email">Email Address</label>
                    </div>
                    
                    <div class="form-group">
                        <input type="password" 
                               id="password" 
                               name="password"
                               required
                               placeholder=" "
                               class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors duration-300 pr-12">
                        <label for="password">Password</label>
                        <button type="button" id="show-password" class="absolute right-3 top-3 text-gray-500 hover:text-gray-700">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    
                    <!-- Password Strength -->
                    <div id="password-strength-container">
                        <div class="flex justify-between text-sm mb-1">
                            <span>Password strength:</span>
                            <span id="password-strength-text"></span>
                        </div>
                        <div id="password-strength" class="h-2 bg-gray-200 rounded-full"></div>
                    </div>
                    
                    <div class="form-group">
                        <input type="password" 
                               id="confirm-password" 
                               name="confirm-password"
                               required
                               placeholder=" "
                               class="form-input w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors duration-300 pr-12">
                        <label for="confirm-password">Confirm Password</label>
                        <button type="button" id="show-confirm-password" class="absolute right-3 top-3 text-gray-500 hover:text-gray-700">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    
                    <label class="flex items-start">
                        <input type="checkbox" 
                               required
                               class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 mt-1">
                        <span class="ml-2 text-gray-700 text-sm">
                            I agree to the 
                            <a href="#" class="text-blue-600 hover:text-blue-800">Terms of Service</a> 
                            and 
                            <a href="#" class="text-blue-600 hover:text-blue-800">Privacy Policy</a>
                        </span>
                    </label>
                    
                    <label class="flex items-start">
                        <input type="checkbox" 
                               class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 mt-1">
                        <span class="ml-2 text-gray-700 text-sm">
                            Subscribe to newsletter for course updates and tips
                        </span>
                    </label>
                    
                    <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-semibold rounded-lg hover:shadow-lg transition-all duration-300 hover:scale-105">
                        Create Account
                    </button>
                </form>
                
                <div class="mt-8 pt-8 border-t border-gray-200">
                    <p class="text-center text-gray-600 mb-4">Or sign up with</p>
                    <div class="grid grid-cols-2 gap-3">
                        <button class="py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors duration-300 flex items-center justify-center">
                            <i class="fab fa-google text-red-500 mr-2"></i>
                            Google
                        </button>
                        <button class="py-3 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors duration-300 flex items-center justify-center">
                            <i class="fab fa-github text-gray-800 mr-2"></i>
                            GitHub
                        </button>
                    </div>
                </div>
                
                <p class="text-center mt-8 text-gray-600">
                    Already have an account? 
                    <a href="login.html" class="text-blue-600 hover:text-blue-800 font-medium">
                        Sign in here
                    </a>
                </p>
            </div>
            
            <!-- Features -->
            <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white rounded-xl p-4 text-center shadow">
                    <i class="fas fa-graduation-cap text-blue-500 text-2xl mb-2"></i>
                    <p class="text-sm font-medium">Free Courses</p>
                </div>
                <div class="bg-white rounded-xl p-4 text-center shadow">
                    <i class="fas fa-certificate text-green-500 text-2xl mb-2"></i>
                    <p class="text-sm font-medium">Certificates</p>
                </div>
                <div class="bg-white rounded-xl p-4 text-center shadow">
                    <i class="fas fa-chart-line text-purple-500 text-2xl mb-2"></i>
                    <p class="text-sm font-medium">Progress Tracking</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Back to Home Button -->
    <a href="../index.html" id="back-to-home" class="fixed bottom-6 left-6 w-12 h-12 bg-gray-800 text-white rounded-full shadow-xl hover:shadow-2xl transition-all duration-300 hover:scale-110 z-40 flex items-center justify-center">
        <i class="fas fa-home"></i>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/auth.js"></script>
    <script src="../script.js"></script>
</body>
</html>
